[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceformat"
version = "1.0.0"
description = "Enterprise Health Informatics & Statistical Mechanics Engine with Pydantic v2 and SHA-256 Audit Chaining"
authors = [{ name = "EvidenceFormat Core Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.31.0",
    "pandas>=2.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "mypy>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]